<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1345" width="1000" height="1345" role="img" aria-labelledby="title desc">
  <title id="title">automated-dev-pipeline, end to end</title>
  <desc id="desc">Flow of the automated-dev-pipeline skill: idea sources, pre-check and adapter, ideate, incubate, roadmap routine, PR sweep with merge or hold, release gates, owner approval, publish and security re-verify; a keep-current column of dependency bot, refresh, periodic review and upkeep feeding the same sweep; and the rule 13 feedback loop that every run writes to and the next run reads back.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1 { font-size: 22px; font-weight: 700; fill: #111827; }
    .sub { font-size: 13px; fill: #4b5563; }
    .sec { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; fill: #6b7280; }
    .t { font-size: 13.5px; font-weight: 700; fill: #111827; }
    .tm { font-size: 12px; font-weight: 400; fill: #6b7280; }
    .d { font-size: 12px; fill: #374151; }
    .lbl { font-size: 12px; fill: #374151; }
    .lblp { font-size: 12px; fill: #5b3aa8; }
    .auto { fill: #eaf2fb; stroke: #2c5d8f; stroke-width: 1.5; }
    .human { fill: #fff2d9; stroke: #b7650b; stroke-width: 2; }
    .fb { fill: #f1ebfc; stroke: #6b46c1; stroke-width: 1.5; }
    .note { fill: #f4f4f5; stroke: #a1a1aa; stroke-width: 1.2; }
    .flow { fill: none; stroke: #374151; stroke-width: 1.6; }
    .back { fill: none; stroke: #6b46c1; stroke-width: 1.8; stroke-dasharray: 6 4; }
    .gap { fill: none; stroke: #ffffff; stroke-width: 7; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#374151"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b46c1"/>
    </marker>
    <symbol id="person" viewBox="0 0 16 16">
      <circle cx="8" cy="4.6" r="3.2" fill="#b7650b"/>
      <path d="M1.5 15.5c0-3.8 2.9-6 6.5-6s6.5 2.2 6.5 6z" fill="#b7650b"/>
    </symbol>
  </defs>

  <!-- solid light background so it reads in dark previews -->
  <rect x="0" y="0" width="1000" height="1345" fill="#ffffff"/>

  <!-- header -->
  <text class="h1" x="30" y="40">automated-dev-pipeline, end to end</text>
  <text class="sub" x="30" y="63">Unattended stages do the work. A person decides only at the amber boxes; making a repo public always waits for one.</text>

  <!-- legend -->
  <rect x="700" y="96" width="270" height="104" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text class="sec" x="714" y="115">LEGEND</text>
  <rect class="auto" x="714" y="125" width="18" height="13" rx="3"/>
  <text class="d" x="740" y="136">Automated: a script or a model</text>
  <rect class="human" x="714" y="145" width="18" height="13" rx="3"/>
  <use href="#person" x="716" y="145" width="13" height="13"/>
  <text class="d" x="740" y="156">Human: a person decides</text>
  <rect class="fb" x="714" y="165" width="18" height="13" rx="3"/>
  <text class="d" x="740" y="176">Feedback: one run writes, the next reads</text>
  <line class="flow" x1="714" y1="190" x2="744" y2="190" marker-end="url(#a)"/>
  <text class="d" x="750" y="194">work flows</text>
  <line class="back" x1="828" y1="190" x2="858" y2="190" marker-end="url(#ap)"/>
  <text class="d" x="864" y="194">read back</text>

  <!-- ================= BUILD ================= -->
  <text class="sec" x="30" y="88">BUILD</text>

  <rect class="note" x="30" y="96" width="180" height="104" rx="8"/>
  <text class="t" x="42" y="116">Idea sources</text>
  <text class="d" x="42" y="134">read-only, one ID per idea</text>
  <text class="d" x="42" y="149">notes · labelled issues</text>
  <text class="d" x="42" y="164">board export · idea cards</text>
  <text class="d" x="42" y="179">backlogs · filtered feeds</text>

  <line class="flow" x1="210" y1="148" x2="238" y2="148" marker-end="url(#a)"/>

  <rect class="auto" x="240" y="96" width="190" height="104" rx="8"/>
  <text class="t" x="252" y="116">Pre-check + adapter</text>
  <text class="tm" x="252" y="134">script, no model</text>
  <text class="d" x="252" y="149">skip if planned ≥ threshold</text>
  <text class="d" x="252" y="164">list ideas, drop the IDs</text>
  <text class="d" x="252" y="179">already in the ledger</text>

  <line class="flow" x1="430" y1="148" x2="458" y2="148" marker-end="url(#a)"/>

  <rect class="auto" x="460" y="96" width="190" height="104" rx="8"/>
  <text class="t" x="472" y="116">Ideate</text>
  <text class="tm" x="472" y="134">mid-tier model, 1 idea per run</text>
  <text class="d" x="472" y="149">shortlist ≤ 10, pick one</text>
  <text class="d" x="472" y="164">business plan, web research</text>
  <text class="d" x="472" y="179">score 1–10 → ledger row</text>

  <line class="flow" x1="555" y1="200" x2="555" y2="233" marker-end="url(#a)"/>
  <text class="lbl" x="562" y="222">planned</text>

  <!-- ledger note -->
  <rect class="note" x="30" y="235" width="185" height="80" rx="8"/>
  <text class="t" x="42" y="255">Ledger: PIPELINE.md</text>
  <text class="d" x="42" y="273">every stage reads it first</text>
  <text class="d" x="42" y="288">and writes it last</text>
  <text class="d" x="42" y="303">planned → incubating → public</text>

  <rect class="auto" x="250" y="235" width="400" height="80" rx="8"/>
  <text class="t" x="262" y="255">Incubate <tspan class="tm">· strongest model · capped</tspan></text>
  <text class="d" x="262" y="273">top planned plan → repo, docs, ROADMAP with release gates</text>
  <text class="d" x="262" y="288">private remote via the security wrapper, controls read back</text>
  <text class="d" x="262" y="303">registers its weekly roadmap routine and a sweep target</text>

  <line class="flow" x1="450" y1="315" x2="450" y2="348" marker-end="url(#a)"/>

  <!-- Needs owner (human) -->
  <rect class="human" x="30" y="350" width="185" height="104" rx="8"/>
  <use href="#person" x="191" y="358" width="16" height="16"/>
  <text class="t" x="42" y="370">Needs &lt;owner&gt;</text>
  <text class="d" x="42" y="388">work only a person can do,</text>
  <text class="d" x="42" y="403">tagged in the ROADMAP;</text>
  <text class="d" x="42" y="418">the routine skips it, the</text>
  <text class="d" x="42" y="433">PR and reports list it</text>

  <rect class="auto" x="250" y="350" width="400" height="104" rx="8"/>
  <text class="t" x="262" y="370">Roadmap routine <tspan class="tm">· per repo, weekly, throwaway worktree</tspan></text>
  <text class="d" x="262" y="388">next unchecked item above the gate line; claim it [-]</text>
  <text class="d" x="262" y="403">verify: build, test, lint. A failure reverts, no PR</text>
  <text class="d" x="262" y="418">tick + CHANGELOG, one PR: roadmap/auto-&lt;date&gt;</text>
  <text class="d" x="262" y="433">or APPEND MODE onto the open PR; never merges itself</text>

  <line class="flow" x1="450" y1="454" x2="450" y2="493" marker-end="url(#a)"/>
  <text class="lbl" x="457" y="479">PR</text>

  <rect class="auto" x="250" y="495" width="400" height="90" rx="8"/>
  <text class="t" x="262" y="515">PR sweep <tspan class="tm">· strongest model, 2×/week, the one merge gate</tspan></text>
  <text class="d" x="262" y="533">hard gates first: mergeable, checks green, not draft</text>
  <text class="d" x="262" y="548">runner holdPaths: a PR that publishes a site waits</text>
  <text class="d" x="262" y="563">per-prefix review, then squash-merge or HOLD</text>

  <line class="flow" x1="345" y1="585" x2="345" y2="618" marker-end="url(#a)"/>
  <line class="flow" x1="555" y1="585" x2="555" y2="618" marker-end="url(#a)"/>

  <rect class="human" x="250" y="620" width="190" height="62" rx="8"/>
  <use href="#person" x="416" y="628" width="16" height="16"/>
  <text class="t" x="262" y="640">HOLD + comment</text>
  <text class="d" x="262" y="658">a person merges it, or the</text>
  <text class="d" x="262" y="673">next run answers the hold</text>

  <rect class="auto" x="460" y="620" width="190" height="62" rx="8"/>
  <text class="t" x="472" y="640">Squash-merge to main</text>
  <text class="d" x="472" y="658">ROADMAP item ticked</text>
  <text class="d" x="472" y="673">CHANGELOG entry lands</text>

  <line class="flow" x1="555" y1="682" x2="555" y2="710" marker-end="url(#a)"/>

  <rect class="auto" x="460" y="712" width="190" height="66" rx="8" stroke-width="2.4"/>
  <text class="t" x="472" y="732">Release gates done?</text>
  <text class="d" x="472" y="750">open items above "## After</text>
  <text class="d" x="472" y="765">public release" = 0</text>

  <!-- ================= PUBLISH ================= -->
  <line class="flow" x1="555" y1="778" x2="555" y2="803" marker-end="url(#a)"/>
  <text class="lbl" x="562" y="796">yes</text>
  <text class="sec" x="255" y="797">PUBLISH</text>

  <rect class="auto" x="250" y="805" width="400" height="75" rx="8"/>
  <text class="t" x="262" y="825">Graduate: the publish script runs the gates</text>
  <text class="d" x="262" y="843">daily; skips quietly unless something is ready or approved</text>
  <text class="d" x="262" y="858">secret scan (all refs) · commit emails · CI · exit codes</text>
  <text class="d" x="262" y="873">exit 0 published · 1 held · 10 awaiting · 11 rejected</text>

  <line class="flow" x1="450" y1="880" x2="450" y2="910" marker-end="url(#a)"/>
  <text class="lbl" x="457" y="900">gates pass</text>

  <rect class="human" x="250" y="912" width="400" height="80" rx="8"/>
  <use href="#person" x="626" y="920" width="16" height="16"/>
  <text class="t" x="262" y="932">Owner approves on GitHub</text>
  <text class="d" x="262" y="950">release-approval issue + email (exit 10 while awaiting)</text>
  <text class="d" x="262" y="965">closed as Completed = approve · Not planned = reject</text>
  <text class="d" x="262" y="980">email replies are never read; no model may touch the issue</text>

  <line class="flow" x1="450" y1="992" x2="450" y2="1020" marker-end="url(#a)"/>
  <text class="lbl" x="457" y="1011">approved</text>

  <rect class="auto" x="250" y="1022" width="400" height="75" rx="8"/>
  <text class="t" x="262" y="1042">Public, then security re-verified</text>
  <text class="d" x="262" y="1060">script re-runs gates, flips to public, reads controls back</text>
  <text class="d" x="262" y="1075">model: landing-page tiles, records, ledger row → public</text>
  <text class="d" x="262" y="1090">rule 3: a write is not done until it is read back</text>

  <!-- ===== loops back to the roadmap routine (left side) ===== -->
  <!-- solid: not done yet / gate failed -->
  <path class="flow" d="M460 745 H240 V440 H248" marker-end="url(#a)"/>
  <path class="flow" d="M250 842 H240"/>
  <circle cx="240" cy="745" r="3" fill="#374151"/>
  <circle cx="240" cy="842" r="3" fill="#374151"/>
  <text class="lbl" x="452" y="739" text-anchor="end">no</text>
  <text class="lbl" x="214" y="738" text-anchor="end">no: the next run takes</text>
  <text class="lbl" x="214" y="753" text-anchor="end">the next unchecked item</text>
  <text class="lbl" x="214" y="835" text-anchor="end">a gate fails (exit 1):</text>
  <text class="lbl" x="214" y="850" text-anchor="end">stays private; one roadmap</text>
  <text class="lbl" x="214" y="865" text-anchor="end">fix item queued by PR</text>

  <!-- dashed: hold comments + feedback band read back -->
  <path class="gap" d="M250 651 H226"/>
  <path class="back" d="M250 651 H226"/>
  <path class="back" d="M226 1120 V405 H248" marker-end="url(#ap)"/>
  <circle cx="226" cy="651" r="3" fill="#6b46c1"/>
  <text class="lblp" x="214" y="622" text-anchor="end">the hold reason is the</text>
  <text class="lblp" x="214" y="637" text-anchor="end">next run's first item</text>
  <text class="lblp" x="214" y="652" text-anchor="end">(APPEND MODE reads the</text>
  <text class="lblp" x="214" y="667" text-anchor="end">PR comments first)</text>
  <text class="lblp" x="214" y="1020" text-anchor="end">read back before every</text>
  <text class="lblp" x="214" y="1035" text-anchor="end">run: traps, lessons, PR</text>
  <text class="lblp" x="214" y="1050" text-anchor="end">comments, the owner's</text>
  <text class="lblp" x="214" y="1065" text-anchor="end">corrections</text>

  <!-- ================= KEEP CURRENT ================= -->
  <rect x="700" y="235" width="270" height="525" rx="10" fill="#f6f8fa" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text class="sec" x="714" y="258">KEEP CURRENT</text>
  <text class="d" x="714" y="275">every repo, built here or not</text>

  <rect class="auto" x="712" y="290" width="246" height="66" rx="8"/>
  <text class="t" x="724" y="310">Dependency bot</text>
  <text class="d" x="724" y="328">Dependabot or Renovate</text>
  <text class="d" x="724" y="343">patch/minor merge, majors held</text>

  <rect class="auto" x="712" y="370" width="246" height="96" rx="8"/>
  <text class="t" x="724" y="390">Refresh <tspan class="tm">· weekly, per repo</tspan></text>
  <text class="d" x="724" y="408">1. intel file of upstream changes,</text>
  <text class="d" x="724" y="423">each with a primary source</text>
  <text class="d" x="724" y="438">2. fix only what they make stale</text>
  <text class="d" x="724" y="453">big upgrades → new roadmap items</text>

  <rect class="auto" x="712" y="480" width="246" height="52" rx="8"/>
  <text class="t" x="724" y="500">Periodic review <tspan class="tm">· monthly</tspan></text>
  <text class="d" x="724" y="518">source-cited fixes, curated content</text>

  <rect class="auto" x="712" y="546" width="246" height="96" rx="8"/>
  <text class="t" x="724" y="566">Upkeep <tspan class="tm">· weekly report</tspan></text>
  <text class="d" x="724" y="584">red CI, controls off, stuck PRs,</text>
  <text class="d" x="724" y="599">stalled projects, docs drift</text>
  <text class="d" x="724" y="614">landing page synced by PR</text>
  <text class="d" x="724" y="629">Needs &lt;owner&gt; listed until done</text>

  <text class="lbl" x="714" y="672">The roadmap routine keeps</text>
  <text class="lbl" x="714" y="687">running after publish; big</text>
  <text class="lbl" x="714" y="702">upgrades arrive there as items.</text>
  <text class="lbl" x="714" y="732">Every PR here goes to the same</text>
  <text class="lbl" x="714" y="747">sweep, on its own branch prefix.</text>

  <!-- bus into the sweep -->
  <path class="flow" d="M712 323 H688 V594 H712"/>
  <path class="flow" d="M712 418 H688"/>
  <path class="flow" d="M712 506 H688"/>
  <path class="flow" d="M688 540 H652" marker-end="url(#a)"/>
  <circle cx="688" cy="540" r="3" fill="#374151"/>
  <text class="lbl" x="676" y="440" text-anchor="middle" transform="rotate(-90 676 440)">PRs → same sweep</text>

  <!-- published repo stays in scope -->
  <path class="flow" d="M650 1060 H835 V762" marker-end="url(#a)"/>
  <text class="lbl" x="743" y="1052" text-anchor="middle">stays in scope</text>

  <!-- ================= FEEDBACK ================= -->
  <rect x="20" y="1120" width="960" height="212" rx="10" fill="#faf7ff" stroke="#6b46c1" stroke-width="1.5"/>
  <text class="sec" x="34" y="1142" style="fill:#5b3aa8">FEEDBACK LOOP · RULE 13</text>
  <text class="lblp" x="232" y="1142">every run writes here and the next run reads it back; built into the runner, not into each prompt</text>

  <rect class="fb" x="34" y="1155" width="225" height="78" rx="8"/>
  <text class="t" x="46" y="1175">Run history (JSONL)</text>
  <text class="d" x="46" y="1193">start + end record per run: status,</text>
  <text class="d" x="46" y="1208">minutes, turns, cost, errors, PR</text>
  <text class="d" x="46" y="1223">a start with no end = silent death</text>

  <rect class="fb" x="271" y="1155" width="225" height="78" rx="8"/>
  <text class="t" x="283" y="1175">Shared runtime traps</text>
  <text class="d" x="283" y="1193">a session reports TRAP: lines;</text>
  <text class="d" x="283" y="1208">promoted into one file that is</text>
  <text class="d" x="283" y="1223">prepended to every prompt</text>

  <rect class="fb" x="508" y="1155" width="225" height="78" rx="8"/>
  <text class="t" x="520" y="1175">Lessons per job</text>
  <text class="d" x="520" y="1193">LESSON: lines, deduped, newest</text>
  <text class="d" x="520" y="1208">first, ~20 max, on top of the</text>
  <text class="d" x="520" y="1223">job's prompt; the owner edits</text>

  <rect class="fb" x="745" y="1155" width="225" height="78" rx="8"/>
  <text class="t" x="757" y="1175">Review comments read back</text>
  <text class="d" x="757" y="1193">a sweep HOLD or an owner</text>
  <text class="d" x="757" y="1208">comment is the next appending</text>
  <text class="d" x="757" y="1223">run's first item</text>

  <rect class="fb" x="34" y="1243" width="225" height="78" rx="8"/>
  <text class="t" x="46" y="1263">Owner's corrections</text>
  <text class="d" x="46" y="1281">non-fleet commits on the files of</text>
  <text class="d" x="46" y="1296">recent merged PRs: diff shown,</text>
  <text class="d" x="46" y="1311">kept, made a lesson</text>

  <rect class="fb" x="271" y="1243" width="225" height="78" rx="8"/>
  <text class="t" x="283" y="1263">Park owner-only items</text>
  <text class="d" x="283" y="1281">no progress, only owner work left:</text>
  <text class="d" x="283" y="1296">leaves the active stage and frees</text>
  <text class="d" x="283" y="1311">its capped slot</text>

  <rect class="human" x="508" y="1243" width="225" height="78" rx="8"/>
  <use href="#person" x="709" y="1251" width="16" height="16"/>
  <text class="t" x="520" y="1263">Prompt-change PR</text>
  <text class="d" x="520" y="1281">an audit proposes edits from run</text>
  <text class="d" x="520" y="1296">history, traps and holds; never</text>
  <text class="d" x="520" y="1311">applies them. The owner merges</text>

  <rect class="human" x="745" y="1243" width="225" height="78" rx="8"/>
  <use href="#person" x="946" y="1251" width="16" height="16"/>
  <text class="t" x="757" y="1263">[Approval needed] digest</text>
  <text class="d" x="757" y="1281">weekly email to the owner's</text>
  <text class="d" x="757" y="1296">inbox: what is waiting on a</text>
  <text class="d" x="757" y="1311">person to decide</text>
</svg>
