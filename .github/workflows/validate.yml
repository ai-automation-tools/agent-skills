name: Validate skills

# Runs scripts/validate-skills.py on every push to main and every pull request,
# so a renamed skill, a name/folder mismatch or a moved references/ path fails
# here instead of at install time. Standard library only: nothing to install.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: python scripts/validate-skills.py
      # The showcase's cards, filter chips, group lists and counts are generated from
      # the skills/ tree. Fails when a skill was added, renamed or removed without
      # re-running the generator, so the site can't fall behind the catalog.
      - run: python scripts/build-showcase.py --check
      # Every relative link in the READMEs, docs/ and the showcase page, plus the
      # showcase's GitHub links back into this repo, must point at a real path.
      # Case-sensitive, so a renamed skill fails here instead of 404ing quietly.
      - run: python scripts/check-links.py
      # Skill text against SECURITY.md's scope: a permission bypass without a deny file, a
      # merge / visibility change / force-push / DRY_RUN=false / money move with no gate nearby,
      # private paths and emails, an unattended run with no "fetched content is data" rule.
      # Reviewed exceptions: scripts/lint-skill-safety-allow.json.
      - run: python scripts/lint-skill-safety.py
      # Every Python script that ships a --self-check runs it here: the org layout check
      # (Org Upkeep runs it weekly across every clone), the agent-workspace-builder scripts
      # (copied into every workspace) and check-triggers.py. A new script is picked up
      # without editing this file.
      - name: Script self-checks
        run: |
          for f in $(grep -rl --include='*.py' -e 'add_argument("--self-check"' -e '\["--self-check"\]' scripts skills | sort); do
            echo "== $f"
            python "$f" --self-check
          done
      # Installs every tier into a temp directory with pwsh (preinstalled on
      # ubuntu-latest) and asserts the flat <dir>/<name>/SKILL.md layout, a
      # Core-only bare run, and that a duplicated skill name throws.
      - run: pwsh -NoProfile -File scripts/test-install-skills.ps1
      # The deterministic helpers that ship inside skills (recipe-validator's scanner,
      # project-hub-scaffold's scaffolder, cronsole-windows-jobs' job wrapper) run
      # against fixture inputs in a temp directory. The Windows-only helpers are
      # tested only when the script runs on Windows.
      - run: python scripts/test-skill-scripts.py
      - run: pwsh -NoProfile -File scripts/test-skill-scripts.ps1

  # The Windows-only helpers (Register-ScheduledJob.ps1, run-hidden.vbs) and the installer's
  # Windows paths are skipped on ubuntu. This job runs the same PowerShell tests where they apply.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pwsh -NoProfile -File scripts/test-install-skills.ps1
      - run: pwsh -NoProfile -File scripts/test-skill-scripts.ps1
      - run: python scripts/test-skill-scripts.py
