name: Validate skills

# Runs scripts/validate-skills.py on every push to main and every pull request,
# so a renamed skill, a name/folder mismatch or a moved references/ path fails
# here instead of at install time. Standard library only: nothing to install.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: python scripts/validate-skills.py
      # The showcase's cards, filter chips, group lists and counts are generated from
      # the skills/ tree. Fails when a skill was added, renamed or removed without
      # re-running the generator, so the site can't fall behind the catalog.
      - run: python scripts/build-showcase.py --check
      # Every relative link in the READMEs, docs/ and the showcase page, plus the
      # showcase's GitHub links back into this repo, must point at a real path.
      # Case-sensitive, so a renamed skill fails here instead of 404ing quietly.
      - run: python scripts/check-links.py
      # The org layout check (Org Upkeep runs it weekly across every clone) tests its
      # own rules against built-in fixtures, so a broken rule fails here, not on Saturday.
      - run: python skills/core/documentation/repo-docs-builder/scripts/check-org-layout.py --self-check
      # Installs every tier into a temp directory with pwsh (preinstalled on
      # ubuntu-latest) and asserts the flat <dir>/<name>/SKILL.md layout, a
      # Core-only bare run, and that a duplicated skill name throws.
      - run: pwsh -NoProfile -File scripts/test-install-skills.ps1
