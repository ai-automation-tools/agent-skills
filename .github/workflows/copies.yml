name: Copy drift

# Compares every hand-kept copy listed in scripts/copies.json (in other public repos) with
# the committed source here, and fails when one has drifted. Weekly, not per PR: a PR that
# changes a canonical skill drifts until its paired PR in the other repo merges, and that
# shouldn't block it. Report-only; it never edits either side.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - run: python scripts/check-copies.py
        env:
          GH_TOKEN: ${{ github.token }}
