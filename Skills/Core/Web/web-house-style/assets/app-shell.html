<!DOCTYPE html>
<!-- web-house-style starter: APP SHELL.
     Fixed source bar, fixed icon sidebar (collapses to icons, 56px icon rail on phones), top bar beside it.
     Replace SITE / REPO / "App name", the accent pair, and the destinations. Tokens: references/design-system.md §1. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>App name</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#060606" />
  <script>
    // Pre-paint: theme and rail state, so neither flashes. Theme default must equal THEME_DEFAULT below.
    (function () {
      var d = document.documentElement, t = 'dark';
      try {
        var s = localStorage.getItem('SITE.theme'); if (s === 'light' || s === 'dark') t = s;
        if (localStorage.getItem('SITE.rail') === 'shut') d.classList.add('rail-collapsed');
      } catch (e) {}
      d.classList.add(t);
      if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fafafa');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #060606;
      --surface: rgba(24,24,27,.45); --surface-2: rgba(24,24,27,.8); --field: rgba(24,24,27,.4);
      --bar: rgba(6,6,6,.82); --bar-line: #18181b; --rail-bg: #08080a; --srcbar-bg: #0a0a0b;
      --switch-bg: rgba(39,39,42,.6); --pop-bg: #17171b; --pop-shadow: rgba(0,0,0,.7); --thumb: #27272a;
      --line: rgba(63,63,70,.45); --line-2: rgba(63,63,70,.8); --rule: rgba(39,39,42,.6);
      --fg: #f4f4f5; --fg-2: #d4d4d8; --fg-3: #a1a1aa; --fg-4: #71717a; --fg-5: #52525b;
      --accent: #22d3ee; --accent-ink: #0b1220;
      --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
      --r-lg: 12px; --r-md: 8px;
      --ease: cubic-bezier(.2,.7,.2,1);
      --srcbar-h: 34px; --topbar-h: 52px;
      --rail-open: 240px; --rail-shut: 64px; --rail-w: var(--rail-open);
      --gutter: clamp(16px, 1.8vw, 28px);
    }
    html.rail-collapsed { --rail-w: var(--rail-shut); }
    html.light {
      color-scheme: light;
      --bg: #fafafa;
      --surface: rgba(255,255,255,.75); --surface-2: #fff; --field: #fff;
      --bar: rgba(250,250,250,.8); --bar-line: #e4e4e7; --rail-bg: #f4f4f5; --srcbar-bg: #f4f4f5;
      --switch-bg: rgba(228,228,231,.6); --pop-bg: #fff; --pop-shadow: rgba(0,0,0,.18); --thumb: #d4d4d8;
      --line: #e4e4e7; --line-2: #d4d4d8; --rule: #e4e4e7;
      --fg: #09090b; --fg-2: #27272a; --fg-3: #52525b; --fg-4: #63636b; --fg-5: #76767f;
      --accent: #0e7490; --accent-ink: #fff;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { margin: 0; padding-top: var(--srcbar-h); background: var(--bg); color: var(--fg); font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--thumb); border-radius: 3px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    .skip { position: absolute; left: -9999px; top: 40px; z-index: 80; padding: 6px 12px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
    .skip:focus { left: 16px; }

    /* Source bar: fixed above everything; body pays its height in padding. */
    .src-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 70; height: var(--srcbar-h); display: flex; align-items: center; gap: 16px; padding: 0 var(--gutter); background: var(--srcbar-bg); border-bottom: 1px solid var(--bar-line); font-size: 12px; }
    .src-note { margin: 0; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--fg-4); }
    .src-note strong { font-weight: 600; color: var(--accent); }
    .src-link { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 6px; color: var(--fg-3); font-weight: 500; transition: color .15s; }
    .src-link:hover { color: var(--fg); }

    /* Sidebar rail: full height under the source bar. */
    .siderail { position: fixed; top: var(--srcbar-h); left: 0; bottom: 0; width: var(--rail-w); z-index: 41; display: flex; flex-direction: column; gap: 2px; padding: 0 8px 10px; background: var(--rail-bg); border-right: 1px solid var(--bar-line); overflow: hidden; transition: width .18s var(--ease); }
    .rail-brand { flex: none; display: flex; align-items: center; gap: 8px; height: var(--topbar-h); margin: 0 -8px 8px; padding: 0 8px; border-bottom: 1px solid var(--bar-line); }
    .rail-mark { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 6px 7px; border-radius: 9px; font-size: 14px; font-weight: 600; letter-spacing: -.005em; }
    .rail-mark:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .rail-mark svg { width: 26px; height: 26px; flex: none; }
    .rail-toggle { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg-4); cursor: pointer; transition: color .15s, background .15s, border-color .15s; }
    .rail-toggle:hover { color: var(--fg); background: color-mix(in srgb, var(--accent) 10%, transparent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
    .rail-toggle svg { width: 17px; height: 17px; }
    .rail-sep { height: 1px; flex: none; background: var(--line-2); margin: 8px 4px; }
    .rail-glabel { flex: none; padding: 2px 11px 6px; font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .14em; color: var(--fg-5); white-space: nowrap; }
    .rail-btn { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; height: 40px; flex: none; padding: 0 11px; border-radius: 9px; color: var(--fg); font-size: 13px; font-weight: 500; transition: background .15s; }
    .rail-btn svg { width: 18px; height: 18px; flex: none; color: hsl(var(--h) var(--s) var(--l)); }
    .rail-lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rail-btn:hover { background: hsl(var(--h) var(--s) var(--l) / .12); }
    .rail-btn[aria-current="page"] { background: hsl(var(--h) var(--s) var(--l) / .16); }
    .rail-btn[aria-current="page"]::before { content: ""; position: absolute; left: -8px; top: 50%; transform: translateY(-50%); width: 3px; height: 20px; border-radius: 0 3px 3px 0; background: hsl(var(--h) var(--s) var(--l)); }
    .rail-btn::after { content: attr(data-tip); position: absolute; left: calc(100% + 14px); top: 50%; transform: translateY(-50%) translateX(-4px); padding: 5px 9px; border-radius: 6px; background: var(--pop-bg); color: var(--fg); border: 1px solid var(--line-2); font-size: 12px; line-height: 1; white-space: nowrap; pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .13s, transform .13s, visibility .13s; box-shadow: 0 6px 18px -4px var(--pop-shadow); z-index: 2; }
    /* One hue per destination, spent on the glyph, the wash and the edge marker. Labels stay one colour. */
    .nav-home { --h: 152; --s: 60%; --l: 50%; }
    .nav-runs { --h: 217; --s: 91%; --l: 60%; }
    .nav-tasks { --h: 258; --s: 90%; --l: 66%; }
    .nav-settings { --h: 199; --s: 89%; --l: 55%; }
    html.rail-collapsed .siderail { overflow: visible; }
    html.rail-collapsed .rail-brand { flex-direction: column; gap: 6px; height: auto; padding: 8px 4px; }
    html.rail-collapsed .rail-mark { justify-content: center; padding: 6px 0; }
    html.rail-collapsed .rail-mark span, html.rail-collapsed .rail-lbl, html.rail-collapsed .rail-glabel { display: none; }
    html.rail-collapsed .rail-btn { justify-content: center; padding: 0; }
    html.rail-collapsed .rail-btn:hover::after, html.rail-collapsed .rail-btn:focus-visible::after { opacity: 1; visibility: visible; transform: translateY(-50%) translateX(0); }

    /* Top bar: beside the rail, crumb left, actions hard right. */
    .topbar { position: sticky; top: var(--srcbar-h); z-index: 40; margin-left: var(--rail-w); height: var(--topbar-h); display: flex; align-items: center; gap: 14px; padding: 0 var(--gutter); background: var(--bar); backdrop-filter: blur(14px) saturate(150%); -webkit-backdrop-filter: blur(14px) saturate(150%); border-bottom: 1px solid var(--bar-line); transition: margin-left .18s var(--ease); }
    .crumb { min-width: 0; color: var(--fg-4); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .crumb strong { color: var(--fg); font-weight: 500; }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
    .theme-sw { display: inline-flex; align-items: center; gap: 2px; padding: 2px; border-radius: 12px; background: var(--switch-bg); flex: none; }
    .theme-sw button { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 24px; padding: 0; border: 0; border-radius: 10px; background: transparent; color: var(--fg-4); cursor: pointer; transition: color .15s, background-color .15s; }
    .theme-sw button:hover { color: var(--fg); }
    .theme-sw button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .05); }
    .theme-sw button:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 0; }
    .theme-sw svg { width: 13px; height: 13px; }

    /* Content */
    main { margin-left: var(--rail-w); padding: 28px var(--gutter) 48px; transition: margin-left .18s var(--ease); }
    .shell { max-width: min(100%, 1280px); }
    h1 { margin: 0; font-size: 24px; letter-spacing: -.025em; font-weight: 650; }
    .sub { margin: 6px 0 0; color: var(--fg-3); }
    .panels { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(272px, 100%), 1fr)); gap: 14px; margin-top: 22px; }
    .panel { padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); }
    .panel .k { font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-4); }
    .panel .v { margin-top: 6px; font-size: 26px; font-weight: 650; letter-spacing: -.02em; }

    /* Phone: below 720px the rail is a fixed 56px icon rail (it IS the navigation, no hamburger). */
    @media (max-width: 760px) { .crumb { display: none; } }
    @media (max-width: 720px) {
      :root { --rail-open: 56px; --rail-shut: 56px; }
      .rail-lbl, .rail-glabel, .rail-mark span, .rail-toggle { display: none; }
      .rail-mark, .rail-btn { justify-content: center; padding-inline: 0; }
    }
    @media (max-width: 600px) {
      input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]), select, textarea { font-size: 16px; }
      .theme-sw button { width: 36px; height: 32px; }
      .src-link { align-self: stretch; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div class="src-bar">
  <p class="src-note"><strong>Open source</strong> &middot; one short line about the app.</p>
  <a class="src-link" href="https://github.com/ai-automation-tools/REPO" target="_blank" rel="noopener">
    <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    View source
  </a>
</div>

<nav class="siderail" aria-label="Main">
  <div class="rail-brand">
    <a class="rail-mark" href="#">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M10 22V10l12 12V10" stroke="var(--accent-ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <span>App name</span>
    </a>
    <button class="rail-toggle" id="railToggle" type="button" aria-label="Collapse sidebar" aria-expanded="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
    </button>
  </div>
  <a class="rail-btn nav-home" href="#" aria-current="page" aria-label="Home" data-tip="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span class="rail-lbl">Home</span>
  </a>
  <a class="rail-btn nav-runs" href="#" aria-label="Runs" data-tip="Runs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><span class="rail-lbl">Runs</span>
  </a>
  <a class="rail-btn nav-tasks" href="#" aria-label="Tasks" data-tip="Tasks">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span class="rail-lbl">Tasks</span>
  </a>
  <div class="rail-sep"></div>
  <div class="rail-glabel">Reference</div>
  <a class="rail-btn nav-settings" href="#" aria-label="Settings" data-tip="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="rail-lbl">Settings</span>
  </a>
</nav>

<header class="topbar">
  <div class="crumb">App name / <strong>Home</strong></div>
  <div class="topbar-right">
    <div class="theme-sw" id="themeSw" role="group" aria-label="Theme">
      <button type="button" data-theme="light" aria-pressed="false" aria-label="Light theme" title="Light theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></button>
      <button type="button" data-theme="dark" aria-pressed="true" aria-label="Dark theme" title="Dark theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg></button>
    </div>
  </div>
</header>

<main id="main">
  <div class="shell">
    <h1>Home</h1>
    <p class="sub">One line about this view.</p>
    <div class="panels">
      <div class="panel"><div class="k">Runs today</div><div class="v">42</div></div>
      <div class="panel"><div class="k">Failures</div><div class="v">0</div></div>
      <div class="panel"><div class="k">Next run</div><div class="v">14:00</div></div>
    </div>
  </div>
</main>

<script>
  const d = document.documentElement;
  // Theme switch. THEME_DEFAULT must equal the pre-paint default in <head>.
  const THEME_KEY = 'SITE.theme', THEME_DEFAULT = 'dark';
  const themeBtns = document.querySelectorAll('#themeSw button');
  function setTheme(t) {
    d.classList.remove('light', 'dark'); d.classList.add(t);
    themeBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === t)));
    document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'light' ? '#fafafa' : '#060606');
  }
  setTheme(d.classList.contains('light') ? 'light' : THEME_DEFAULT);
  themeBtns.forEach(b => b.addEventListener('click', () => { setTheme(b.dataset.theme); try { localStorage.setItem(THEME_KEY, b.dataset.theme); } catch (e) {} }));

  // Sidebar collapse, persisted.
  const railToggle = document.getElementById('railToggle');
  function syncRail() {
    const shut = d.classList.contains('rail-collapsed');
    railToggle.setAttribute('aria-expanded', String(!shut));
    railToggle.setAttribute('aria-label', shut ? 'Expand sidebar' : 'Collapse sidebar');
  }
  syncRail();
  railToggle.addEventListener('click', () => {
    const shut = d.classList.toggle('rail-collapsed'); syncRail();
    try { localStorage.setItem('SITE.rail', shut ? 'shut' : 'open'); } catch (e) {}
  });
</script>
<script src="https://ai-automation-tools.dev/consent.js" defer></script>
</body>
</html>
