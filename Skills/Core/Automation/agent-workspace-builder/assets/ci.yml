name: CI

# A malformed SKILL.md doesn't raise an error: it silently fails to load. A doc filed in
# the wrong folder doesn't either. These checks make both show up in the PR.

on:
  push:
    branches: [⟨deploy-branch⟩, ⟨working-branch⟩]
  pull_request:
    branches: [⟨deploy-branch⟩]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dev dependencies, if this workspace has any
        run: |
          if [ -f requirements-dev.txt ]; then
            python -m pip install --quiet -r requirements-dev.txt
          fi

      - name: Workspace standard
        run: python scripts/check-structure.py

      - name: Skill, command and agent frontmatter
        run: python scripts/validate-skills.py --strict

      - name: Script self-checks
        run: |
          for f in scripts/*.py; do
            if grep -q -- "--self-check" "$f"; then
              echo "== $f"
              python "$f" --self-check
            fi
          done

      - name: Capability reference is current
        run: python scripts/gen-capabilities.py --check

      - name: Other CLIs' configs are current
        run: python scripts/gen-vendor-configs.py --check

      - name: Relative links resolve
        run: python scripts/check-links.py
